<html>
	<head>
		<title>
			Ian's WebSocket JSON Communication
		</title>
		<style>
			body {
				background-color: white;
				color: black;
				font-family: Courier New;
				font-weight: bold;
				margin: 0px;
			}
			.msg {
				margin-left: 5px;
			}
			input {
				position: fixed;
				z-index: 10;
				bottom: 0px;
				width: 100%;
				background-color: white;
				color: black;
				font-family: Courier New;
				font-weight: bold;
				margin: 0px;
			}
			a {
				color: blue;
			}
		</style>
	</head>
	<body>
		<div id='messages-container'>
			<p class='msg'>
				Welcome to Ian's WebSocket Communication 1.0!
			</p>
			<p class='msg'>
				Go to <a href='https://github.com/sapi-marah/ianwebsocketcommunication/tree/main'>
					https://github.com/sapi-marah/ianwebsocketcommunication/tree/main
				</a>
			</p>
			<p class='msg'>
				to get later and updated versions!
			</p>
		</div>
		<input id='input'>
		<script>
			let socket = new WebSocket('ws://<your_ip>:3000');
			let username = Math.floor(Math.random() * 10000);
			let input = document.getElementById('input');
			let messages = document.getElementById('messages-container');
			input.addEventListener('keydown', function(e) {
				if (e.key === 'Enter') {
					if (socket.readyState === WebSocket.OPEN) {
						socket.send(JSON.stringify({
							username : username,
							content : input.value
						}));
						input.value = '';
					} else {
						let errmsg = document.createElement('p');
						errmsg.textContent = "Sorry, there was an error sending your message. Try sending it again!";
						errmsg.className = 'msg';
						messages.appendChild(errmsg);
					}
				}
			});
			socket.addEventListener('message', function(e) {
				let message = JSON.parse(e.data);
				let msg = document.createElement('p');
				msg.textContent = message.username + ': ' + message.content;
				messages.appendChild(msg);
			});
		</script>
	</body>
</html>
